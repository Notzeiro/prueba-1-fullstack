{% extends "base.html" %}
{% load static %}

{% block title %}Registro Usuario{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/registroUsuario.css' %}">
{% endblock %}

{% block content %}

<div class="cuadro">

    <h1>Registro</h1>

    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="id_nombre" class="form-label">Nombre Completo</label>
            <input type="text" class="form-control" id="id_nombre" name="nombre">
        </div>
        <div class="mb-3">
            <label for="id_email" class="form-label">Correo</label>
            <input type="email" class="form-control" id="id_email" name="email">
        </div>
        <div class="mb-3">
            <label for="id_password1" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="id_password1" name="password1">
        </div>
        <div class="mb-3">
            <label for="id_password2" class="form-label">Confirmar Contraseña</label>
            <input type="password" class="form-control" id="id_password2" name="password2">
        </div>
        <div class="mb-3">
            <label for="id_telefono" class="form-label">Teléfono (opcional)</label>
            <input type="text" class="form-control" id="id_telefono" name="telefono">
        </div>

        <div class="btn-medio">
            <button type="submit" class="btn btn-primary">Registrar</button>
        </div>
    </form>

</div>

{% endblock %}
